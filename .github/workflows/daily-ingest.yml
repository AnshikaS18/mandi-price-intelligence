name: Daily Mandi Price Ingestion

# Runs automatically every day, and can also be triggered manually from the
# Actions tab (useful for testing without waiting for the schedule).
on:
  schedule:
    # 3:00 AM UTC = 8:30 AM IST. Cron format: minute hour day month weekday.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Needed so this workflow is allowed to commit the new CSV back to the repo.
permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scripts/ingest.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.csv
          git diff --staged --quiet && echo "No new data to commit" || git commit -m "Automated daily ingestion $(date -u +%Y-%m-%d)"
          git push